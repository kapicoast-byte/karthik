# Slack app manifest for catalogbot.
#
# Create the app from this file:
#   https://api.slack.com/apps  →  Create New App  →  From an app manifest
#   pick your workspace, paste this YAML, Create, then Install to Workspace.
#
# Socket Mode is on, so no public URL is needed - the app dials out to Slack.
# That is what makes a laptop or a container a viable dev host.
#
# The `user` scopes are the ones open question Q1 is about: a bot can only see
# channels it is invited to, so reading the owner's DMs needs a user token.
# Installing this in your own sandbox proves the mechanism works, which leaves
# the client's admin approval as the only open variable.
display_information:
  name: Catalogbot
  description: Turns actionable Slack messages into Plane work items
  background_color: "#0e6b5e"

features:
  bot_user:
    display_name: Catalogbot
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read     # capture @mentions
      - channels:history      # read messages in public channels it joins
      - channels:read         # resolve channel names
      - chat:write            # post drafts, questions and the daily digest
      - groups:history        # private channels it is invited to
      - groups:read
      - im:history            # DMs with the bot itself
      - im:read
      - im:write              # open a DM to ask the owner a question
      - mpim:history          # group DMs
      - mpim:read
      - users:read            # resolve sender names
    user:
      - channels:history      # §3: the owner's own conversations
      - groups:history
      - im:history
      - mpim:history

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true          # the Create task / Not a task buttons
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
